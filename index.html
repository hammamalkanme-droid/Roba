<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي الكانمي الاحترافي 👑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- استدعاء مكتبات Firebase السحابية المحدثة والمستقرة -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // مفاتيح مشروعك الثابتة
    const firebaseConfig = {
      apiKey: "AIzaSyB9wITy6jhiIKIUwtpX7YEK2X4448-QDCw",
      authDomain: "addlist-c2c2d.firebaseapp.com",
      projectId: "addlist-c2c2d",
      storageBucket: "addlist-c2c2d.firebasestorage.app",
      messagingSenderId: "5553235519",
      appId: "1:5553235519:web:5f136a8a64c899a230fa8a",
      measurementId: "G-4P840280Y9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // ربط الدوال بالنافذة العامة لتسهيل الاستدعاء
    window.db = db;
    window.fbModules = { collection, addDoc, getDocs, doc, setDoc, getDoc };
  </script>

  <style>
    :root {
      --bg-dark: #0f172a; --bg-card: rgba(30, 41, 59, 0.95);
      --primary: #8b5cf6; --secondary: #ec4899;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
      --text-light: #f8fafc; --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: radial-gradient(circle at top right, #1e1b4b, #0f172a); min-height: 100vh; color: var(--text-light); display: flex; flex-direction: column; align-items: center; padding: 15px; }

    .navbar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 15px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .brand { font-weight: 900; font-size: 1.3rem; background: linear-gradient(to right, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-nav { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.3s; }
    .btn-nav:hover { background: var(--primary); }

    .container { width: 100%; max-width: 600px; }
    .card { background: var(--bg-card); border-radius: 24px; padding: 30px 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; }
    .card.active { display: block; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    h2 { text-align: center; margin-bottom: 10px; font-size: 1.6rem; }
    p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }

    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; }
    input, select { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,23,42,0.6); color: white; outline: none; font-size: 1rem; transition: 0.3s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(139,92,246,0.4); }

    .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 5px 20px rgba(139,92,246,0.4); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.6); }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: white; }
    .btn-outline:hover { background: var(--primary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
    .cat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px 15px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
    .cat-card:hover { background: var(--primary); transform: translateY(-5px); border-color: var(--primary); }
    .lock { position: absolute; top: 10px; left: 10px; font-size: 1.1rem; }

    .timer-bar-container { width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .timer-bar-fill { height: 100%; width: 100%; background: var(--success); transition: width 1s linear; }
    .q-box { background: rgba(15,23,42,0.5); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 14px; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; text-align: right; transition: 0.2s; }
    .opt-btn:hover { border-color: var(--primary); background: rgba(139,92,246,0.15); }
    .opt-btn.correct { background: rgba(16,185,129,0.2) !important; border-color: var(--success) !important; color: var(--success); }
    .opt-btn.wrong { background: rgba(239,68,68,0.2) !important; border-color: var(--danger) !important; color: var(--danger); }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">👑 تحدي الكانمي</div>
    <button class="btn-nav" onclick="openAdminLogin()">الإدارة ⚙️</button>
  </div>

  <div class="container">

    <!-- 1. تسجيل الدخول بالاسم -->
    <div id="s-login" class="card active">
      <h2>أهلاً بيك يا كويس! 🎯</h2>
      <p class="subtitle">اكتب اسمك الحقيقي زي جهاد (اسمك محجوز ليك بروحك)</p>
      <div class="input-group">
        <input type="text" id="player-name-input" placeholder="مثال: همام الكانمي...">
      </div>
      <button class="btn btn-primary" onclick="registerPlayer()">دخول للتحدي 🚀</button>
    </div>

    <!-- 2. اختيار الأقسام -->
    <div id="s-categories" class="card">
      <h2>اختر القسم يا <span id="welcome-name" style="color:var(--warning);"></span></h2>
      <p class="subtitle">كل قسم مخصص لفئة معينة</p>
      <div id="cats-grid" class="grid"></div>
      <button class="btn btn-outline" onclick="loadLeaderboard()" style="margin-top:25px;">🏆 لوحة المتصدرين العامة</button>
    </div>

    <!-- 3. شاشة اللعب -->
    <div id="s-game" class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:bold; color:var(--warning);">
        <span id="g-cat-title">قسم</span>
        <span id="g-counter">سؤال 1 / 5</span>
      </div>
      <div class="timer-bar-container">
        <div id="timer-fill" class="timer-bar-fill"></div>
      </div>
      <div class="q-box">
        <h2 id="q-text" style="font-size:1.3rem; margin:0;">نص السؤال؟</h2>
        <img id="q-img" style="width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-top:15px; display:none;" alt="">
      </div>
      <div id="opts-container" class="options"></div>
    </div>

    <!-- 4. شاشة النتيجة -->
    <div id="s-result" class="card">
      <h2>🎉 انتهت محاولتك!</h2>
      <div style="font-size:3.5rem; text-align:center; font-weight:900; color:var(--warning); margin:15px 0;">
        <span id="res-score">0</span> / <span id="res-total">0</span>
      </div>
      <p id="res-desc" style="text-align:center; font-size:1.1rem; margin-bottom:25px; font-weight:bold;"></p>
      <button class="btn btn-primary" onclick="goToCategories()">الرجوع للأقسام 🔄</button>
    </div>

    <!-- 5. لوحة المتصدرين -->
    <div id="s-leaderboard" class="card">
      <h2>🏆 لوحة المتصدرين الكبرى</h2>
      <p class="subtitle">أفضل الأبطال على مستوى اللعبة</p>
      <div id="lb-list" style="max-height:300px; overflow-y:auto; margin-bottom:20px;"></div>
      <button class="btn btn-outline" onclick="goToCategories()">رجوع</button>
    </div>

    <!-- 6. دخول الإدارة -->
    <div id="s-admin-login" class="card">
      <h2>دخول لوحة التحكم 🔐</h2>
      <div class="input-group">
        <input type="password" id="admin-pass" placeholder="كلمة المرور (123456)">
      </div>
      <button class="btn btn-primary" onclick="verifyAdmin()">دخول</button>
      <button class="btn btn-outline" onclick="goToCategories()">إلغاء</button>
    </div>

    <!-- 7. لوحة الأدمن -->
    <div id="s-admin" class="card">
      <h2>لوحة الأدمن 🛠️</h2>
      <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:14px; margin-bottom:20px;">
        <h3 style="color:var(--primary); font-size:1rem; margin-bottom:10px;">➕ إضافة سؤال جديد للسحابة</h3>
        <div class="input-group"><label>اسم القسم:</label><input type="text" id="a-cat" value="عام"></div>
        <div class="input-group"><label>باسورد القسم (اختياري):</label><input type="text" id="a-pass" placeholder="مثال: فوزي123"></div>
        <div class="input-group"><label>نص السؤال:</label><input type="text" id="a-q" placeholder="السؤال..."></div>
        <div class="input-group"><label>رابط الصورة (اختياري):</label><input type="text" id="a-img" placeholder="رابط مباشر"></div>
        <div class="input-group"><label>وقت السؤال (بالثواني):</label><input type="number" id="a-time" value="15"></div>
        <div class="input-group">
          <label>الخيارات (4 خيارات):</label>
          <input type="text" id="ao0" placeholder="الأول" style="margin-bottom:6px;">
          <input type="text" id="ao1" placeholder="الثاني" style="margin-bottom:6px;">
          <input type="text" id="ao2" placeholder="الثالث" style="margin-bottom:6px;">
          <input type="text" id="ao3" placeholder="الرابع">
        </div>
        <div class="input-group">
          <label>الإجابة الصحيحة:</label>
          <select id="a-correct">
            <option value="0">الخيار الأول</option>
            <option value="1">الخيار الثاني</option>
            <option value="2">الخيار الثالث</option>
            <option value="3">الخيار الرابع</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="cloudAddQuestion()">حفظ السؤال في السحابة ☁️</button>
      </div>
      <button class="btn btn-outline" onclick="goToCategories()">خروج 🚪</button>
    </div>

  </div>

  <script>
    let currentUser = "";
    let currentCat = "";
    let catQuestions = [];
    let qIdx = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 15;
    let isLockedAns = false;

    function showCard(id) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    window.goToCategories = function() { 
      showCard('s-categories'); 
      loadCategories(); 
    }
    
    window.openAdminLogin = function() { 
      showCard('s-admin-login'); 
    }

    // تسجيل اللاعب وحجز الاسم
    window.registerPlayer = async function() {
      let name = document.getElementById('player-name-input').value.trim();
      if(!name) { alert("اكتب اسمك الأول!"); return; }

      try {
        const { doc, getDoc, setDoc } = window.fbModules;
        const userRef = doc(window.db, "users", name);
        const userSnap = await getDoc(userRef);

        if(userSnap.exists()) {
          alert("⚠️ هذا الاسم مسجل مسبقاً لشخص آخر! اختر اسماً مميزاً.");
          return;
        }

        await setDoc(userRef, { name: name, createdAt: new Date() });
        currentUser = name;
        document.getElementById('welcome-name').innerText = name;
        goToCategories();
      } catch(e) {
        console.error(e);
        alert("صار خطأ في الاتصال بالشبكة، تأكد من الإنترنت وحاول مرة ثانية.");
      }
    }

    // جلب الأقسام
    async function loadCategories() {
      try {
        const { collection, getDocs } = window.fbModules;
        const querySnapshot = await getDocs(collection(window.db, "questions"));
        let grid = document.getElementById('cats-grid');
        grid.innerHTML = "";

        let catsMap = {};
        querySnapshot.forEach((docSnap) => {
          let q = docSnap.data();
          if(!catsMap[q.cat]) catsMap[q.cat] = { count: 0, pass: q.catPass || "" };
          catsMap[q.cat].count++;
        });

        if(Object.keys(catsMap).length === 0) {
          grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;'>لا توجد أسئلة حالياً، ادخل لوحة الأدمن (من فوق) وضيف أسئلة!</p>";
          return;
        }

        for(let cat in catsMap) {
          let hasPass = catsMap[cat].pass !== "";
          let div = document.createElement('div');
          div.className = "cat-card";
          div.innerHTML = `
            ${hasPass ? '<span class="lock">🔒</span>' : ''}
            <h3 style="margin-top:${hasPass?'10px':'0'}">${cat}</h3>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">${catsMap[cat].count} أسئلة</p>
          `;
          div.onclick = () => checkCatAccess(cat, catsMap[cat].pass);
          grid.appendChild(div);
        }
      } catch(e) {
        console.error(e);
      }
    }

    window.checkCatAccess = async function(cat, pass) {
      const { doc, getDoc } = window.fbModules;
      const attemptRef = doc(window.db, "attempts", `${currentUser}_${cat}`);
      const attemptSnap = await getDoc(attemptRef);

      if(attemptSnap.exists()) {
        alert("❌ عذراً يا " + currentUser + "! لقد قمت بلعب هذا القسم مسبقاً، ولك محاولة واحدة فقط.");
        return;
      }

      if(pass) {
        let entered = prompt("هذا القسم محمي بكلمة مرور. أدخل الرمز:");
        if(entered !== pass) { alert("كلمة المرور غير صحيحة!"); return; }
      }

      currentCat = cat;
      fetchQuestionsForGame(cat);
    }

    async function fetchQuestionsForGame(cat) {
      const { collection, getDocs } = window.fbModules;
      const querySnapshot = await getDocs(collection(window.db, "questions"));
      catQuestions = [];
      querySnapshot.forEach((docSnap) => {
        let q = docSnap.data();
        if(q.cat === cat) catQuestions.push(q);
      });

      if(catQuestions.length === 0) { alert("لا توجد أسئلة في هذا القسم!"); return; }

      qIdx = 0;
      score = 0;
      showCard('s-game');
      document.getElementById('g-cat-title').innerText = cat;
      loadQuestion();
    }

    function loadQuestion() {
      isLockedAns = false;
      let q = catQuestions[qIdx];
      document.getElementById('g-counter').innerText = `سؤال ${qIdx + 1} / ${catQuestions.length}`;
      document.getElementById('q-text').innerText = q.qText;

      let img = document.getElementById('q-img');
      if(q.imgUrl) { img.src = q.imgUrl; img.style.display = "block"; }
      else { img.style.display = "none"; }

      let optBox = document.getElementById('opts-container');
      optBox.innerHTML = "";
      q.options.forEach((opt, idx) => {
        if(!opt) return;
        let btn = document.createElement('button');
        btn.className = "opt-btn";
        btn.innerText = opt;
        btn.onclick = () => submitAnswer(idx, btn);
        optBox.appendChild(btn);
      });

      startTimer(q.time || 15);
    }

    function startTimer(sec) {
      clearInterval(timer);
      timeLeft = sec;
      let total = sec;
      let bar = document.getElementById('timer-fill');
      bar.style.width = "100%";
      bar.style.background = "var(--success)";

      timer = setInterval(() => {
        if(isLockedAns) { clearInterval(timer); return; }
        timeLeft--;
        let pct = (timeLeft / total) * 100;
        bar.style.width = pct + "%";

        if(pct <= 30) bar.style.background = "var(--danger)";
        else if(pct <= 60) bar.style.background = "var(--warning)";

        if(timeLeft <= 0) {
          clearInterval(timer);
          triggerTimeout();
        }
      }, 1000);
    }

    function triggerTimeout() {
      if(isLockedAns) return;
      isLockedAns = true;
      let q = catQuestions[qIdx];
      let btns = document.querySelectorAll('.opt-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');
      if(btns[q.correct]) btns[q.correct].classList.add('correct');
      proceedNext();
    }

    window.submitAnswer = function(idx, btn) {
      if(isLockedAns) return;
      isLockedAns = true;
      clearInterval(timer);
      let q = catQuestions[qIdx];
      let btns = document.querySelectorAll('.opt-btn');
      btns.forEach(b => b.style.pointerEvents = 'none');

      if(idx === q.correct) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        if(btns[q.correct]) btns[q.correct].classList.add('correct');
      }
      proceedNext();
    }

    function proceedNext() {
      setTimeout(() => {
        qIdx++;
        if(qIdx < catQuestions.length) { loadQuestion(); }
        else { finishGame(); }
      }, 1800);
    }

    async function finishGame() {
      showCard('s-result');
      document.getElementById('res-score').innerText = score;
      document.getElementById('res-total').innerText = catQuestions.length;

      let ratio = score / catQuestions.length;
      let desc = ratio === 1 ? "🔥 أسطورة الكانمي! العلامة الكاملة!" : ratio >= 0.5 ? "😎 أداء رائع جداً!" : "😂 ضايع فيها، حاول مرة جاية فقسم تاني!";
      document.getElementById('res-desc').innerText = desc;

      const { doc, setDoc, addDoc, collection } = window.fbModules;
      await setDoc(doc(window.db, "attempts", `${currentUser}_${currentCat}`), { played: true });
      await addDoc(collection(window.db, "leaderboard"), {
        name: currentUser,
        cat: currentCat,
        score: score,
        total: catQuestions.length,
        timestamp: new Date()
      });
    }

    window.loadLeaderboard = async function() {
      showCard('s-leaderboard');
      const { collection, getDocs } = window.fbModules;
      let querySnapshot = await getDocs(collection(window.db, "leaderboard"));
      let list = document.getElementById('lb-list');
      list.innerHTML = "";

      let items = [];
      querySnapshot.forEach(d => items.push(d.data()));
      items.sort((a,b) => (b.score / b.total) - (a.score / a.total));

      if(items.length === 0) { list.innerHTML = "<p style='text-align:center;'>مفيش نتائج مسجلة حتى الآن!</p>"; return; }

      items.forEach((item, idx) => {
        let div = document.createElement('div');
        div.style.cssText = "background:rgba(255,255,255,0.05); padding:12px 15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;";
        let rank = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx+1}`;
        div.innerHTML = `
          <div><span style="font-size:1.2rem; margin-left:10px;">${rank}</span> <strong>${item.name}</strong> <span style="font-size:0.8rem; color:var(--text-muted);">(${item.cat})</span></div>
          <div style="color:var(--success); font-weight:bold; font-size:1.1rem;">${item.score} / ${item.total}</div>
        `;
        list.appendChild(div);
      });
    }

    window.verifyAdmin = function() {
      if(document.getElementById('admin-pass').value === "123456") {
        document.getElementById('admin-pass').value = "";
        showCard('s-admin');
      } else { alert("كلمة المرور غلط!"); }
    }

    window.cloudAddQuestion = async function() {
      try {
        const { addDoc, collection } = window.fbModules;
        let qObj = {
          cat: document.getElementById('a-cat').value.trim(),
          catPass: document.getElementById('a-pass').value.trim(),
          qText: document.getElementById('a-q').value.trim(),
          imgUrl: document.getElementById('a-img').value.trim(),
          time: parseInt(document.getElementById('a-time').value) || 15,
          options: [
            document.getElementById('ao0').value.trim(),
            document.getElementById('ao1').value.trim(),
            document.getElementById('ao2').value.trim(),
            document.getElementById('ao3').value.trim()
          ],
          correct: parseInt(document.getElementById('a-correct').value)
        };

        if(!qObj.qText || !qObj.options[0]) { alert("املأ بيانات السؤال على الأقل!"); return; }

        await addDoc(collection(window.db, "questions"), qObj);
        alert("تم رفع السؤال بنجاح إلى السحابة للجميع! ☁️");
        document.getElementById('a-q').value = "";
        document.getElementById('a-img').value = "";
        document.getElementById('ao0').value = ""; document.getElementById('ao1').value = "";
        document.getElementById('ao2').value.trim = ""; document.getElementById('ao3').value = "";
      } catch(e) {
        console.error(e);
        alert("حدث خطأ أثناء حفظ السؤال، تأكد من الاتصال.");
      }
    }
  </script>
</body>
</html>
